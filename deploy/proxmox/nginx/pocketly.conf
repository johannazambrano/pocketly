# Pocketly: sito statico servito in HTTPS nella rete locale.
# Copia in /etc/nginx/sites-available/pocketly e attiva con:
#   ln -s /etc/nginx/sites-available/pocketly /etc/nginx/sites-enabled/pocketly
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
# I certificati si generano con deploy/proxmox/make-cert.sh.

server {
    listen 80 default_server;
    server_name _;

    # Il certificato della CA è pubblico (la chiave no): serve scaricarlo da qui per poterlo installare
    # sui dispositivi, prima che il browser si fidi dell'HTTPS.
    location = /ca.crt {
        alias /etc/nginx/ssl/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/pocketly.crt;
    ssl_certificate_key /etc/nginx/ssl/pocketly.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/pocketly;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    # Qualsiasi percorso che non è un file reale serve la app (come _redirects / vercel.json).
    location / {
        try_files $uri /index.html;
    }

    # Non vanno tenuti in cache dal browser, altrimenti gli aggiornamenti non arrivano.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js      { add_header Cache-Control "no-cache"; }

    # Alcune versioni di nginx non conoscono l'estensione .webmanifest e la servirebbero come octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # I file in assets/ hanno l'hash nel nome: si possono tenere in cache a lungo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
