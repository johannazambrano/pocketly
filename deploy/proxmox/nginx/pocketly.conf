# Pocketly: sito statico servito in HTTPS nella rete locale.
# Copia in /etc/nginx/sites-available/pocketly e attiva con:
#   ln -s /etc/nginx/sites-available/pocketly /etc/nginx/sites-enabled/pocketly
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
# I certificati si generano con deploy/proxmox/make-cert.sh.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Il certificato della CA è pubblico (la chiave no): serve scaricarlo da qui per poterlo installare
    # sui dispositivi, prima che il browser si fidi dell'HTTPS.
    location = /ca.crt {
        alias /etc/nginx/ssl/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/pocketly.crt;
    ssl_certificate_key /etc/nginx/ssl/pocketly.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/pocketly;
    index index.html;
    server_tokens off;

    # Intestazioni di sicurezza (PKT-14, vedi docs/architettura/sicurezza.md). Attenzione: nginx non le eredita in un
    # blocco `location` che ha un suo `add_header`. Per questo la pagina dell'app (/index.html) le ripete tutte e gli
    # altri blocchi ripetono almeno `nosniff`. Chi aggiunge un `add_header` in un blocco deve ripeterle anche lì.
    # La CSP permette solo file di questo sito: l'app non carica niente da fuori. `data:` per le immagini serve
    # all'icona di iOS incorporata in index.html, `blob:` alle esportazioni; 'unsafe-inline' sugli stili ai colori
    # calcolati da Vue.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    # Qualsiasi percorso che non è un file reale serve la app (come _redirects / vercel.json).
    location / {
        try_files $uri /index.html;
    }

    # Non vanno tenuti in cache dal browser, altrimenti gli aggiornamenti non arrivano.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location = /push-worker.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Alcune versioni di nginx non conoscono l'estensione .webmanifest e la servirebbero come octet-stream.
    location = /manifest.webmanifest {
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # I moduli di Workbox generati nella root hanno l'hash nel nome: si possono tenere in cache a lungo.
    location ~* ^/workbox-[a-f0-9]+\.js$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Server di sincronizzazione (install-sync.sh). Solo qui, in HTTPS: dal server sulla porta 80 non è raggiungibile.
    # Se il servizio non è installato nginx risponde 502 e l'app nasconde la sincronizzazione.
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 6m;
        add_header Cache-Control "no-store" always;
    }

    # I file in assets/ hanno l'hash nel nome: si possono tenere in cache a lungo.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
